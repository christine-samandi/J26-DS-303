name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The job id is the status-check name required by the `protect-main` ruleset.
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/component1-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/component1-orchestrator/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  # C3 — GraphRAG retrieval: contract validation, mock API, lint
  validate-c3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/component3-graphrag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/component3-graphrag/pyproject.toml
      - name: Install
        run: pip install -e ../../contracts -e ".[dev,api]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
