[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "component3-graphrag"
version = "0.1.0"
description = "C3 — GraphRAG regulatory knowledge base and versioned retrieval for Sri Lankan income tax"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Install only what the phase you're working on needs, e.g. pip install -e ".[dev,api]"
ingest = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.24",
]
nlp = [
    "spacy>=3.7",
]
graph = [
    "neo4j>=5.20",
]
vector = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",
    "fastapi>=0.110",
]
all = [
    "component3-graphrag[ingest,nlp,graph,vector,api,dev]",
]

[tool.setuptools.packages.find]
include = [
    "c3_common*",
    "data_collection*",
    "entity_recognition*",
    "knowledge_graph*",
    "vector_store*",
    "retrieval_api*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
    "c3_common",
    "data_collection",
    "entity_recognition",
    "knowledge_graph",
    "vector_store",
    "retrieval_api",
]
