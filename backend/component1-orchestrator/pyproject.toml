[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "component1-orchestrator"
version = "0.1.0"
description = "C1 — Agentic orchestrator, deterministic tax calculation agent, explanation agent"
requires-python = ">=3.11"
# j26-contracts is the shared contracts package in the repo (contracts/).
# Install it first: pip install -e ../../contracts
dependencies = [
    "j26-contracts>=1.0.0",
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["tax_calculation_agent*"]

[tool.setuptools.package-data]
tax_calculation_agent = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["tax_calculation_agent", "conftest"]
