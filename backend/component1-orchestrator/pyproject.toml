[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "component1-orchestrator"
version = "0.1.0"
description = "C1 — Agentic orchestrator, deterministic tax calculation agent, explanation agent"
requires-python = ">=3.11"
# j26-contracts is the shared contracts package in the repo (contracts/).
# Install it first: pip install -e ../../contracts
dependencies = [
    "j26-contracts>=1.0.0",
    # Pinned: only orchestrator/graph.py imports it, so an upgrade is a one-file review.
    "langgraph==1.2.15",
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
]
# LLM calls (pure-LLM baseline now; interpretation + explanation later). Never imported by
# tax_calculation_agent/, which test_engine_properties enforces.
llm = [
    "google-genai>=2.30",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["tax_calculation_agent*", "orchestrator*", "explanation_agent*"]

[tool.setuptools.package-data]
tax_calculation_agent = ["rules/*.yaml"]
orchestrator = ["mock_data/*.json", "mock_data/ocr/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["tax_calculation_agent", "orchestrator", "explanation_agent", "conftest"]
